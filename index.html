<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#64666b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お絵描き">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>お絵描きツール</title>
<style>
/* Layout: 灰色の作業面にキャンバス。カラー・ブラシ・レイヤーの窓が左に浮かぶ(ドラッグで移動)。
   スケッチの注釈色だったピンクを、選択中の印だけに使う。 */
:root {
  --ws: #b3b5b9;
  --panel: #64666b;
  --panel-hi: #74767b;
  --well: #c1c3c7;
  --well-dim: #a8aaae;
  --ink: #1f2023;
  --on-panel: #f3f4f5;
  --accent: #e0458f;
  --sheet: #eceef0;
  --paper: #ffffff;
  --shadow: 0 8px 22px rgba(24, 25, 30, .30), 0 0 0 1px rgba(0, 0, 0, .12);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; position: relative; overflow: hidden;
  background: var(--ws); color: var(--ink);
  font: 12px/1.4 var(--font);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

#stage { position: absolute; inset: 0; touch-action: none; cursor: crosshair; overflow: hidden; }
#board {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  background: var(--paper); box-shadow: 0 2px 14px rgba(0, 0, 0, .25); will-change: transform;
}
#board.px canvas { image-rendering: pixelated; }
.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

#ui { position: absolute; inset: 0; pointer-events: none; }
.win {
  position: absolute; width: 224px; box-sizing: border-box;
  background: var(--panel); color: var(--on-panel);
  border-radius: 8px; box-shadow: var(--shadow); overflow: hidden;
  pointer-events: auto; touch-action: pan-y;
  display: flex; flex-direction: column;
}
.dots {
  width: 10px; height: 14px; flex: none;
  background: radial-gradient(circle, rgba(255, 255, 255, .6) 1.2px, transparent 1.7px) 0 0 / 5px 5px;
}
.wh {
  display: flex; flex: none; align-items: center; gap: 7px; height: 26px; padding: 0 10px;
  background: var(--panel-hi); font-size: 11px; letter-spacing: .08em;
  cursor: grab; touch-action: none;
}
.wh .t { flex: 1; }
.wh .info { font-variant-numeric: tabular-nums; letter-spacing: 0; display: flex; align-items: center; gap: 6px; }

.win.tool { flex-direction: row; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 5px; padding: 6px 8px; }
.win.tool .grip { display: flex; align-items: center; height: 34px; padding-right: 3px; cursor: grab; touch-action: none; }

.ib {
  width: 34px; height: 34px; flex: none; border: 0; border-radius: 6px; padding: 0;
  background: var(--well); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
}
.ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ib:active { transform: scale(.95); }
.ib:disabled { opacity: .38; cursor: default; transform: none; }
.ib.on { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

/* color */
.chip i { width: 14px; height: 14px; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(255, 255, 255, .7); }
.ringwrap { position: relative; flex: none; width: 164px; height: 164px; margin: 8px auto; touch-action: none; }
.ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(360 100% 50%));
  -webkit-mask: radial-gradient(circle closest-side, transparent 77.5%, #000 78.5%, #000 98%, transparent 99.3%);
          mask: radial-gradient(circle closest-side, transparent 77.5%, #000 78.5%, #000 98%, transparent 99.3%);
}
.sv {
  position: absolute; left: 50%; top: 50%; width: 52.4%; height: 52.4%; margin: -26.2% 0 0 -26.2%;
  background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, var(--hue, red));
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .35);
}
.knob {
  position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .25);
  pointer-events: none;
}

/* brush */
.brows {
  display: grid; gap: 6px; padding: 8px 8px 6px; align-content: start;
  flex: 1 1 122px; min-height: 44px; box-sizing: border-box;
  overflow-y: auto; touch-action: pan-y; scrollbar-width: thin;
}
.brow {
  position: relative; display: block; height: 32px; padding: 0; border: 0; border-radius: 6px;
  background: var(--well); cursor: pointer; overflow: hidden; touch-action: manipulation;
}
.brow canvas { display: block; width: 100%; height: 100%; }
.brow span { position: absolute; left: 8px; top: 3px; font-size: 10px; letter-spacing: .06em; color: var(--ink); }
.brow.sel { box-shadow: 0 0 0 2px var(--accent); }
.sliders { display: grid; flex: none; gap: 0; padding: 2px 10px 14px; }
.sl-h { display: flex; justify-content: space-between; font-size: 11px; margin-top: 2px; }
.sl-h b { font-weight: 500; font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0;
  background: transparent; touch-action: none; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--well) var(--p, 50%));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
  background: #f6f7f8; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--well); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #f6f7f8; border: 2px solid var(--accent); }

/* layers */
.lbody { display: flex; flex: 1; min-height: 0; gap: 6px; padding: 6px; }
#llist { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; touch-action: pan-y; scrollbar-width: thin; }
.lrow {
  display: grid; grid-template-columns: 24px auto 1fr auto 20px; grid-template-rows: 28px 18px; column-gap: 3px; align-items: center; height: 48px; flex: none; padding: 0 6px 0 2px; box-sizing: border-box;
  background: var(--well); color: var(--ink); border-radius: 6px; cursor: pointer; touch-action: manipulation;
}
.lrow.sel { box-shadow: 0 0 0 2px var(--accent); }
.lrow.hid { color: #55575c; }
.lrow.hid .th { opacity: .4; }
.eye { width: 24px; height: 28px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; cursor: pointer; color: inherit; flex: none; }
.eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.th { flex: none; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .3); display: block; }
.lname { flex: 1; min-width: 0; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 3px; }
.lock { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.lop-wrap { grid-column: 2 / 6; display: flex; align-items: center; gap: 6px; min-width: 0; padding-left: 2px; }
.lop-wrap input { flex: 1; min-width: 0; height: 18px; }
.lop-wrap input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }
.lop-wrap input::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -6px; border-width: 2px; box-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
.lop-wrap b { flex: none; width: 32px; text-align: right; font-size: 10px; font-weight: 500; font-variant-numeric: tabular-nums; }
.lbtns { display: flex; flex-direction: column; flex: none; gap: 6px; }

.hbtn {
  width: 34px; height: 22px; flex: none; margin-right: -6px; border: 0; border-radius: 5px; padding: 0;
  background: transparent; color: var(--on-panel); display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
}
.hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.hbtn[aria-pressed=true] { background: rgba(255, 255, 255, .22); }
.rz {
  position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; z-index: 2; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 0 52%, rgba(255, 255, 255, .6) 52% 60%, transparent 60% 72%, rgba(255, 255, 255, .6) 72% 80%, transparent 80%);
}
.win.tool .rz { width: 12px; height: 12px; }
#loupe {
  position: fixed; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 4px 12px rgba(0, 0, 0, .35); pointer-events: none; z-index: 1500;
}

#toast {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: rgba(32, 33, 36, .92); color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 16px;
  pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 2000; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; }

/* dialogs */
#modal { position: absolute; inset: 0; background: rgba(30, 31, 34, .55); display: grid; place-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
.sheet {
  background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 18px 18px 16px;
  width: 100%; max-width: 520px; max-height: 100%; overflow: auto; box-shadow: 0 16px 48px rgba(0, 0, 0, .35); box-sizing: border-box;
}
.sheet h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: .04em; text-wrap: balance; }
.sheet p { margin: 0 0 12px; font-size: 12px; color: #3d3f44; }
.sheet .warn { color: #9c1f58; }
.grp { margin: 10px 0 6px; font-size: 11px; letter-spacing: .12em; color: #3d3f44; }
.sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 9px;
  background: #fff; border: 2px solid transparent; border-radius: 8px; cursor: pointer; touch-action: manipulation;
}
.size:hover, .size:active { border-color: var(--accent); }
.size .box { height: 68px; display: grid; place-items: center; }
.size .box i { display: block; background: #d7d9dd; box-shadow: inset 0 0 0 1.5px #8a8c92; }
.size b { font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.size small { font-size: 10px; color: #4a4c52; }
.row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 6px; padding: 9px 16px; background: #d6d8dc; font-size: 13px; cursor: pointer; touch-action: manipulation; }
.btn.main { background: var(--ink); color: #fff; }
.exp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.exp .btn { padding: 14px 8px; background: #fff; text-align: center; line-height: 1.5; }
.exp .btn b { display: block; font-size: 15px; letter-spacing: .06em; }
.exp .btn small { color: #4a4c52; font-size: 10px; }
#expStatus { margin: 10px 0 0; min-height: 1.4em; font-size: 12px; }
#expImg { display: block; max-width: 100%; max-height: 50vh; margin: 10px auto 0; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2); -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }

/* layer reorder handle */
.lgrip { width: 20px; height: 28px; flex: none; border: 0; background: transparent; padding: 0; display: grid; place-items: center; color: inherit; cursor: grab; touch-action: none; opacity: .7; }
.lgrip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.lrow.drag { opacity: .55; }
.lrow.dl-top { box-shadow: 0 -3px 0 0 var(--accent); }
.lrow.dl-bot { box-shadow: 0 3px 0 0 var(--accent); }
.lrow.sel.dl-top { box-shadow: 0 -3px 0 0 var(--accent), 0 0 0 2px var(--accent); }
.lrow.sel.dl-bot { box-shadow: 0 3px 0 0 var(--accent), 0 0 0 2px var(--accent); }

/* save / backup indicators on the works button */
#b-works { position: relative; }
#b-works::after { content: ''; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
#b-works[data-s=pending]::after { background: var(--accent); }
#b-works[data-s=err]::after { background: #d23; box-shadow: 0 0 0 2px #fff; }
#b-works[data-s=nag]::after { background: transparent; box-shadow: 0 0 0 2px var(--accent) inset; }

/* works dialog */
#dlg-works { max-width: 560px; }
#worksList { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; touch-action: pan-y; }
.wk { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #fff; border-radius: 8px; border: 2px solid transparent; }
.wk.cur { border-color: var(--accent); }
.wk img { width: 52px; height: 52px; object-fit: contain; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2); flex: none; }
.wk .meta { flex: 1; min-width: 0; font-size: 12px; line-height: 1.5; }
.wk .meta b { font-weight: 600; font-variant-numeric: tabular-nums; }
.wk .meta small { display: block; color: #4a4c52; font-size: 10px; }
.wk .btn { padding: 8px 12px; font-size: 12px; }
.wk .btn.danger.arm { background: #c92a5e; color: #fff; }
.wk-empty { font-size: 12px; color: #4a4c52; padding: 8px 2px; }
.bk { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bk .btn { background: #fff; padding: 12px 8px; line-height: 1.4; }
#bkStatus { margin: 0 0 8px; }
#bkStatus.warn { color: #9c1f58; }

@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="stage" aria-label="キャンバス"><div id="board"></div></div>

<div id="ui">
  <section class="win tool" id="w-tool" aria-label="ツールバー">
    <div class="grip" title="ドラッグで移動"><i class="dots"></i></div>
    <button class="ib" id="b-works" data-icon="new" aria-label="作品・新規キャンバス・バックアップ" title="作品・新規・バックアップ"></button>
    <button class="ib" id="b-fit" data-icon="fit" aria-label="画面に合わせる" title="画面に合わせる"></button>
    <button class="ib" id="b-export" data-icon="export" aria-label="書き出し" title="書き出し"></button>
    <button class="ib" id="b-undo" data-icon="undo" aria-label="元に戻す" title="元に戻す(2本指タップ)"></button>
    <button class="ib" id="b-redo" data-icon="redo" aria-label="やり直す" title="やり直す(3本指タップ)"></button>
  </section>

  <section class="win" id="w-color" aria-label="カラー">
    <header class="wh"><i class="dots"></i><span class="t">カラー</span><span class="info chip"><i id="sw"></i><span id="hex">#2A2C33</span></span></header>
    <div class="ringwrap" id="ring">
      <div class="ring"></div>
      <div class="sv" id="sv"></div>
      <i class="knob" id="svk"></i>
      <i class="knob" id="hk"></i>
    </div>
  </section>

  <section class="win" id="w-brush" aria-label="ブラシ">
    <header class="wh"><i class="dots"></i><span class="t">ブラシ</span><span class="info" id="pv">筆圧 -</span><button class="hbtn" id="b-adv" data-icon="sliders" aria-pressed="false" aria-label="最小サイズと筆圧感度の表示切り替え" title="最小サイズ・筆圧感度の表示切り替え"></button></header>
    <div class="brows" id="brows">
      <button class="brow sel" data-tool="pencil" aria-label="鉛筆"><canvas width="416" height="64"></canvas><span>鉛筆</span></button>
      <button class="brow" data-tool="eraser" aria-label="消しゴム"><canvas width="416" height="64"></canvas><span>消しゴム</span></button>
    </div>
    <div class="sliders">
      <div class="sl-h"><span>サイズ</span><b id="v-size">14px</b></div>
      <input type="range" id="r-size" min="0" max="1000" step="1" aria-label="サイズ">
      <div class="sl-h adv"><span>最小サイズ</span><b id="v-min">20%</b></div>
      <input class="adv" type="range" id="r-min" min="0" max="100" step="1" aria-label="最小サイズ">
      <div class="sl-h"><span>不透明度</span><b id="v-op">100%</b></div>
      <input type="range" id="r-op" min="1" max="100" step="1" aria-label="不透明度">
      <div class="sl-h adv"><span>筆圧感度(全ブラシ共通)</span><b id="v-sens">60</b></div>
      <input class="adv" type="range" id="r-sens" min="0" max="100" step="1" aria-label="筆圧感度">
    </div>
  </section>

  <section class="win" id="w-layer" aria-label="レイヤー">
    <header class="wh"><i class="dots"></i><span class="t">レイヤー</span><span class="info" id="lcount">1 / 5</span></header>
    <div class="lbody">
      <div id="llist"></div>
      <div class="lbtns">
        <button class="ib" id="l-add" data-icon="plus" aria-label="レイヤーを追加" title="追加"></button>
        <button class="ib" id="l-del" data-icon="minus" aria-label="レイヤーを削除" title="削除"></button>
        <button class="ib" id="l-dup" data-icon="dup" aria-label="レイヤーを複製" title="複製"></button>
        <button class="ib" id="l-merge" data-icon="merge" aria-label="下のレイヤーと結合" title="下のレイヤーと結合"></button>
        <button class="ib" id="l-lock" data-icon="lock" aria-label="アルファロック" title="アルファロック"></button>
      </div>
    </div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="modal" hidden>
  <div class="sheet" id="dlg-works" hidden role="dialog" aria-labelledby="wkTitle">
    <h2 id="wkTitle">作品</h2>
    <p>描いた絵はこの端末に自動で保存されます。新しいキャンバスを作っても、いまの絵は作品として残ります。</p>
    <div id="worksList"></div>
    <div class="grp">新しいキャンバス(サイズが大きいほどレイヤーは少なくなります)</div>
    <div class="grp">1 : 1</div>
    <div class="sizes" id="sizes-sq"></div>
    <div class="grp">3 : 4</div>
    <div class="sizes" id="sizes-pt"></div>
    <div class="grp">バックアップ</div>
    <p id="bkStatus"></p>
    <div class="bk">
      <button class="btn" id="bk-out"><b>書き出す</b><br><small>全作品を .zip にまとめて保存</small></button>
      <button class="btn" id="bk-in"><b>読み込む</b><br><small>書き出した .zip から復元</small></button>
    </div>
    <input type="file" id="bk-file" accept=".zip,application/zip" hidden>
    <div class="row"><button class="btn main" id="worksClose">閉じる</button></div>
  </div>

  <div class="sheet" id="dlg-export" hidden role="dialog" aria-labelledby="expTitle">
    <h2 id="expTitle">書き出し</h2>
    <p>表示しているレイヤーを重ねた絵を保存します。</p>
    <div class="exp">
      <button class="btn" id="exp-png"><b>PNG</b><small>背景は透明のまま</small></button>
      <button class="btn" id="exp-jpg"><b>JPG</b><small>背景は白で塗りつぶし</small></button>
    </div>
    <p id="expStatus"></p>
    <img id="expImg" alt="書き出した絵" hidden>
    <div class="row"><button class="btn main" id="expClose">閉じる</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- icons ---------- */
const ICONS = {
  new: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  export: '<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v6h14v-6"/>',

      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));

}

  const jobs = dirtyLs.map(L => { L.dirty = false; return canvasBlob(L.canvas).then(b => b.arrayBuffer()).then(buf => ({ k: id + ':' + L.uid, buf })); });
  saveP = saveP.then(async () => {

      rows.forEach(r => ls.put(r));

      const cur = ls.openKeyCursor(IDBKeyRange.bound(id + ':', id + ':￿'));
      cur.onsuccess = () => { const c = cur.result; if (c) { if (!keep.has(c.key)) ls.delete(c.key); c.continue(); } };

}

}
async function openWork(id) {

const fmtDate = t => { const d = new Date(t), z = n => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); };

/* ---------- バックアップ (.zip) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  files.forEach(f => {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    cds.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz;
  });
  const cdSize = cds.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cds, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
function zipRead(buf) {
  const v = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder(), ents = {};
  let e = buf.byteLength - 22; while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not zip');
  const n = v.getUint16(e + 10, true); let p = v.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('bad zip');
    const method = v.getUint16(p + 10, true), csz = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));

  }
  const get = async name => {
    const en = ents[name]; if (!en) return null;
    const s = en.lo + 30 + v.getUint16(en.lo + 26, true) + v.getUint16(en.lo + 28, true), raw = u8.subarray(s, s + en.csz);
    if (en.method === 0) return raw;
    if (en.method === 8 && window.DecompressionStream) {

}
const BK_KEY = 'oekaki.lastBackup';
const lastBackup = () => { try { return +localStorage.getItem(BK_KEY) || 0; } catch (_) { return 0; } };
let hasWorks = false;
function backupDue() { return hasWorks && Date.now() - lastBackup() > 7 * 864e5; }
function updateBackupStatus(n) {
  hasWorks = n > 0; const el = $('#bkStatus'), lb = lastBackup();
  const days = lb ? Math.floor((Date.now() - lb) / 864e5) : -1;
  el.className = backupDue() ? 'warn' : '';
  el.textContent = !lb ? (n ? 'まだバックアップを取っていません。ブラウザの都合で保存データが消えることがあるため、ときどき書き出してファイルAppに置いておくと安心です。' : 'バックアップは、作品ができてから取れます。')
    : (days === 0 ? '最後のバックアップ: 今日' : '最後のバックアップ: ' + days + '日前') + (backupDue() ? '(そろそろ取り直しをおすすめします)' : '');
  refreshDot();
}
async function exportBackup() {
  const st = $('#bkStatus'); st.className = ''; st.textContent = 'バックアップを作成中…';
  try {
    await flushSave();
    const ws = await dbAllWorks(); if (!ws.length) { st.textContent = '保存された作品がありません。'; return; }
    const enc = new TextEncoder(), files = [{ name: 'oekaki-backup.json', data: enc.encode(JSON.stringify({ v: 1, created: Date.now(), works: ws.map(w => w.id) })) }];
    for (const m of ws) {
      files.push({ name: m.id + '/meta.json', data: enc.encode(JSON.stringify(m)) });
      for (const l of m.layers) { const b = await dbGetLayer(m.id + ':' + l.uid); if (b) files.push({ name: m.id + '/' + l.uid + '.png', data: new Uint8Array(b) }); }
    }
    const blob = zipBuild(files), name = 'oekaki-backup-' + stamp2() + '.zip';
    const svc = await getSaver();
    await svc.save({ filename: name, data: blob });
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (_) {}
    updateBackupStatus(ws.length); st.textContent = '保存しました: ' + name + '(' + ws.length + '作品)';
  } catch (err) {
    updateBackupStatus(hasWorks ? 1 : 0);
    st.textContent = err && err.code === 'declined' ? '保存をキャンセルしました。' : 'バックアップを保存できませんでした。';
  }
}
async function importBackup(file) {
  const st = $('#bkStatus'); st.className = ''; st.textContent = '読み込み中…';
  try {
    const z = zipRead(await file.arrayBuffer()), dec = new TextDecoder();
    const man = JSON.parse(dec.decode(await z.get('oekaki-backup.json')));
    const have = new Map((await dbAllWorks()).map(w => [w.id, w.updated])); let ok = 0, skip = 0;
    const d = await dbOpen();
    for (const id of man.works) {
      const m = JSON.parse(dec.decode(await z.get(id + '/meta.json')));
      if (have.has(id) && have.get(id) >= m.updated) { skip++; continue; }
      const rows = [];
      for (const l of m.layers) { const u = await z.get(id + '/' + l.uid + '.png'); if (u) rows.push({ k: id + ':' + l.uid, buf: u.slice().buffer }); }
      const t = d.transaction(['works', 'layerdata'], 'readwrite'); rows.forEach(r => t.objectStore('layerdata').put(r)); t.objectStore('works').put(m); await txDone(t); ok++;
    }
    st.textContent = ok + '作品を復元しました' + (skip ? '(' + skip + '作品は新しいデータがあるためそのままです)' : '') + '。';
    await refreshWorks(); st.textContent = ok + '作品を復元しました' + (skip ? '(' + skip + '作品は端末内のほうが新しいためそのままです)' : '') + '。';
  } catch (_) { st.textContent = 'このファイルは読み込めませんでした。このアプリで書き出した .zip を選んでください。'; }
}
$('#bk-out').addEventListener('click', exportBackup);
$('#bk-in').addEventListener('click', () => $('#bk-file').click());
$('#bk-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });

    localStorage.setItem(SKEY, JSON.stringify({ v: 1, brushes, tool, hsv, sens, g }));

}

/* ---------- export ---------- */
let dl = null, objUrl = null;
/* 保存先: Claude内ではdownloads機能、単独で開いたときは共有シート(iPad) → ダウンロードの順 */
const webSaver = {
  async save({ filename, data }) {
    const file = new File([data], filename, { type: data.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return { status: 'saved' }; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const u = URL.createObjectURL(file), a = document.createElement('a');
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    return { status: 'saved' };
  }
};
async function getSaver() {
  if (dl) return dl;
  if (window.claude && window.claude.use) { try { const x = await window.claude.use('downloads'); if (x) return x; } catch (_) {} }
  return webSaver;
}
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(x => { dl = x; }, () => {}); } catch (_) {}
function flatten(bg) {
  const c = document.createElement('canvas'); c.width = doc.w; c.height = doc.h;
  const x = c.getContext('2d');
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  doc.layers.forEach(L => { if (L.visible) { x.globalAlpha = L.opacity; x.drawImage(L.canvas, 0, 0); } });
  x.globalAlpha = 1;
  return c;
}
const stamp2 = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()); };
$('#b-export').addEventListener('click', () => { $('#expStatus').textContent = ''; $('#expImg').hidden = true; showDialog('export'); });
$('#expClose').addEventListener('click', closeDialog);
async function doExport(kind) {
  const st = $('#expStatus'), img = $('#expImg');
  st.textContent = '書き出し中…'; img.hidden = true;
  const jpg = kind === 'jpg', type = jpg ? 'image/jpeg' : 'image/png';
  const blob = await new Promise(res => flatten(jpg ? '#ffffff' : null).toBlob(res, type, 0.92));
  if (!blob) { st.textContent = '書き出しに失敗しました。キャンバスを小さくして試してください。'; return; }
  const name = 'oekaki-' + stamp2() + '.' + kind;
  const showImage = msg => {
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(blob); img.src = objUrl; img.hidden = false; st.textContent = msg;
  };
  const svc = await getSaver();
  try {
    await svc.save({ filename: name, data: blob });
    st.textContent = '保存しました: ' + name;
  } catch (err) {
    if (err && err.code === 'declined') st.textContent = '保存をキャンセルしました。';
    else showImage('保存できませんでした。画像を長押しして「写真に保存」を選んでください。');
  }
}
$('#exp-png').addEventListener('click', () => doExport('png'));
$('#exp-jpg').addEventListener('click', () => doExport('jpg'));

{

{
